# Bygger nettsidens datafiler fra data/kilder/ og publiserer nettsiden på GitHub Pages.
#
# Startes av innhentingene (oppdatering.yml og regjeringen.yml), manuelt, eller når
# nettsiden eller byggingen endres på main.
name: Publiser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - "side/**"
      - sources.yaml
      - horinger/bygg.py

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publiser
  cancel-in-progress: false

jobs:
  publiser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.publisering.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install --disable-pip-version-check -r requirements-kjoring.txt

      - name: Bygg datafilene
        run: python -m horinger.bygg

      - name: Lagre datafilene
        run: >-
          python verktoy/git_lagre.py data "Data: oversikten bygget"

      - name: Sett sammen nettstedet
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r side _site/
          cp data/horinger.json data/status.json data/arkiv.json _site/data/
          # Postlistetreff (sprint 7). Finnes ikke før postlista er hentet første gang.
          if [ -f data/postliste_treff.json ]; then cp data/postliste_treff.json _site/data/; fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Publiser
        id: publisering
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
