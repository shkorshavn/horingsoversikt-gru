# Tester og kodesjekk ved hver push til main (sprint 6, Svein 26.10.2026).
#
# Kjører det samme som punkt A og B i sjekklisten: ruff og hele testsuiten. Henter ingen
# kilder. Feiler en sjekk, blir kjøringen rød i Actions, og GitHub sender e-post til den som
# pushet. Kjøringer som bare oppdaterer data (fra den ukentlige oppdateringen), hoppes over.
name: Tester

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester:
    # Fast versjon: Playwright 1.56 støtter ikke Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.2

      - name: Kodekvalitet (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tester (pytest)
        shell: bash
        run: |
          set -o pipefail
          pytest -v -rf 2>&1 | tee pytest.log

      # Feilede tester vises som merknader på kjøringen, slik at de kan leses uten hele loggen.
      - name: Vis feilede tester
        if: ${{ failure() }}
        shell: bash
        run: grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-900 | sed 's/^/::error::/' || true
