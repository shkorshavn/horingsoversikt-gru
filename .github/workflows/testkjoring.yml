# Testkjøring mot ekte data (sprint 1).
#
# Startes bare manuelt (Actions → Testkjøring → Run workflow). Kjører tester og
# innhenting, og lagrer resultat, logg og rå kildesider som vedlegg til kjøringen
# og på grenen `testkjoring` (overskrives hver gang). Hovedgrenen `main` røres
# ikke. Den ukentlige, automatiske kjøringen kommer i sprint 3.
name: Testkjøring

on:
  workflow_dispatch:
    inputs:
      hent_raa:
        description: "Hent rå kildesider til testdata"
        type: boolean
        default: true
      adresser:
        description: "Bare for utforsking: egne adresser å hente rått (mellomrom mellom), i stedet for standardlisten"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  testkjoring:
    # Fast versjon: Playwright 1.56 støtter ikke Ubuntu 26, som ubuntu-latest går over til
    # fra 19.10.2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          npm install --no-save axe-core@4.10.2

      - name: Kodekvalitet (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tester (pytest)
        shell: bash
        run: pytest -v 2>&1 | tee pytest.log

      - name: Hent rå kildesider
        if: ${{ inputs.hent_raa }}
        continue-on-error: true
        env:
          HENT_RAA_ADRESSER: ${{ inputs.adresser }}
        run: python verktoy/hent_raa.py --ut raa/ 2>&1 | tee hent_raa.log

      - name: Innhenting mot ekte data
        continue-on-error: true
        run: python -m horinger.kjor --utdata ut/ --raa raa-kjoring/ 2>&1 | tee kjor.log

      - name: Last opp resultat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resultat
          path: |
            ut/
            raa/
            raa-kjoring/
            *.log
          if-no-files-found: warn
          retention-days: 14

      - name: Legg resultatet på grenen testkjoring
        if: always()
        run: |
          mkdir -p /tmp/resultat
          cp -r ut raa raa-kjoring *.log /tmp/resultat/ 2>/dev/null || true
          cd /tmp/resultat
          git init -q -b testkjoring
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Testkjøring ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" testkjoring
