    kategori: Stortinget
    niva: Stortinget
    prioritet: 1
    url: https://data.stortinget.no/eksport/horinger
    metode: api
    modul: stortinget
    aktiv: true
    anbefalt: aktiv
    sprint: 1
    merknad: Spør både nåværende og neste sesjon. Fristen avgjør om høringen er åpen.

  - navn: Regjeringen.no
    kategori: Regjeringen og departementene
    niva: Regjeringen
    prioritet: 1
    url: https://www.regjeringen.no/no/dokument/hoyringar/id1763/
    metode: html
    modul: regjeringen
    kjoring: pc  # Cloudflare stopper GitHub; hentes på GRUs PC (se docs/oppsett-pc.md)
    aktiv: true
    anbefalt: aktiv
    sprint: 1
    merknad: Bare ?page= er tillatt i robots.txt. Departementer i ekskluder_departementer filtreres bort.

