    modul: vegvesen
    aktiv: true
    # PDF-listene er sperret i robots.txt (*.pdf): lenke vises
    horingsparter: {detalj: true, pdf: true}
    anbefalt: aktiv
    sprint: 1
    merknad: Regelverkshøringer (alle) og prosjekthøringer (geografisk filtrert).

  - navn: Nye Veier
