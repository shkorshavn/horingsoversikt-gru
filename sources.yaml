# Kildeliste for høringsoversikten.
#
# Grunnlag: docs/kildekartlegging.md (sprint 0, godkjent 16.10.2026).
#
# Felter per kilde:
#   navn       visningsnavn
#   kategori   gruppe på nettsiden
#   niva       forvaltningsnivå for filteret på nettsiden: Stortinget, Regjeringen,
#              Direktorater og etater, Fylkeskommunen eller Statsforvalteren
#   prioritet  1 = alltid relevant, 2 = ofte, 3 = av og til
#   url        liste- eller API-adresse
#   metode     api | html | json-i-html | rss
#   modul      kildemodul i horinger/kilder/ (bare for kilder som er bygget)
#   kjoring    hvor kilden hentes: github (standard) eller pc (GRUs PC, se docs/oppsett-pc.md)
#   aktiv      true = hentes i dag
#   anbefalt   anbefaling fra kartleggingen: aktiv | inaktiv
#   sprint     sprinten kilden bygges i
#   merknad    kort begrunnelse
#
# En kilde hentes bare når både `aktiv: true` og `modul` er satt.

felles:
  user_agent: "HoringsoversiktGRU/0.1 (+mailto:svein-havar@gjovikregionen.no)"
  pause_sekunder: 1.5
  tidsavbrudd_sekunder: 30

  # Departementer på regjeringen.no som ikke skal tas med (Svein 16.10.2026).
  ekskluder_departementer:
    - Energidepartementet
    - Barne- og familiedepartementet
    - Utenriksdepartementet

  # Løft til høy prioritet (Svein 25.10.2026): høringer med middels eller lav prioritet blir
  # høy når tittel eller ingress inneholder et av disse ordene eller en kommune i geografien.
  # Se horinger/prioritet.py.
  prioritet_loft:
    ord: [kommune, kommunen, kommunene, kommuner, kommunal, kommunale, kommunalt, kommunenes,
          fylkeskommune, fylkeskommunen, fylkeskommunene, fylkeskommunal, fylkeskommunale,
          plan- og bygningsloven, plan- og bygningslova, Innlandet]

  # Geografisk filter for landsdekkende lister (avklart med Svein 16.10.2026).
  # Oslo og Nittedal står bevisst ikke i `kommuner`: de tas bare med når høringen
  # gjelder rv. 4. Rv. 4 og E6 håndteres i horinger/geografi.py.
  geografi:
    kommuner:
      # Gjøvikregionen
      - Gjøvik
      - Østre Toten
      - Vestre Toten
      - Søndre Land
      - Nordre Land
      # Hadeland
      - Gran
      - Lunner
      - Jevnaker
      # Lillehammer-regionen
      - Lillehammer
      - Gausdal
      - Øyer
      # Hamar-regionen
      - Hamar
      - Ringsaker
      - Stange
      - Løten
      # Valdres
      - Etnedal
      - Sør-Aurdal
      - Nord-Aurdal
      - Vestre Slidre
      - Øystre Slidre
      - Vang
    # Tettsteder i kommunene over (sprint 4). Sider nevner ofte stedet, ikke kommunen
    # (f.eks. «reguleringsarbeid i Moelv» hos Bane NOR). Bare entydige navn er tatt med.
    steder:
      [Raufoss, Lena, Skreia, Kapp, Bøverbru, Eina, Reinsvoll, Hunndalen, Biri, Snertingdal,
       Redalen, Dokka, Odnes, Torpa, Brandbu, Jaren, Harestua, Tretten, Follebu, Fåberg,
       Moelv, Brumunddal, Ottestad, Fagernes, Bagn, Beitostølen, Mjøsbrua]
    # Alle kommunene i Innlandet fylke (2024). Brukes der Svein vil ha med hele fylket, ikke
    # bare regionen og nabokommunene: Riksantikvarens fredningssaker (Svein 25.10.2026).
    innlandet_kommuner:
      [Alvdal, Dovre, Eidskog, Elverum, Engerdal, Etnedal, Folldal, Gausdal, Gjøvik, Gran,
       Grue, Hamar, Kongsvinger, Lesja, Lillehammer, Lom, Løten, Nord-Aurdal, Nord-Fron,
       Nord-Odal, Nordre Land, Os, Rendalen, Ringebu, Ringsaker, Sel, Skjåk, Stange,
       Stor-Elvdal, Sør-Aurdal, Sør-Fron, Sør-Odal, Søndre Land, Tolga, Trysil, Tynset, Vang,
       Vestre Slidre, Vestre Toten, Våler, Vågå, Østre Toten, Øyer, Øystre Slidre, Åmot, Åsnes]
    # E6 tas bare med sammen med en av disse kommunene.
    e6_kommuner:
      - Eidsvoll
      - Ullensaker
      - Lillestrøm

  # Høringsparter (sprint 6). Hver høringspart i listen vurderes for seg, og bare listen over
  # høringsparter brukes, ikke teksten ellers. Reglene i horinger/horingsparter.py:
  #   eksakt:     parten er nøyaktig lik frasen («KS»)
  #   start:      parten er lik eller begynner med frasen («Alle kommuner (356)»). Følger det
  #               «i <område>», må området stå i `omrader` («alle kommuner i Innlandet»),
  #               slik at «kommunene i Troms» ikke treffer
  #   inneholder: frasen står som hele ord hvor som helst i parten
  #   ordslutt:   et ord i parten slutter på frasen («distriktsdepartementet»)
  #   utelat:     parten treffer aldri regelen når denne frasen står i den
  # Store og små bokstaver regnes som like.
  horingsparter:
    omrader: [landet, norge, innlandet, innlandet fylke]

    # Regionen er høringspart (Svein 26.10.2026). Ikke Statsforvalteren, og ikke andre
    # nabokommuner enn Ringsaker og Lillehammer. En høring med flagg løftes til høy prioritet.
    regionflagg:
      kommuner: [Gjøvik, Østre Toten, Vestre Toten, Søndre Land, Nordre Land, Ringsaker,
                 Lillehammer]
      # Grunner som ikke gir flagg alene (Svein 26.10.2026: «KS alene skal ikke medføre
      # regionflagg»). KS står på nesten alle departementenes lister. Sammen med f.eks. «Alle
      # kommuner» vises KS fortsatt som grunn.
      ikke_alene: [KS]
      regler:
        - navn: Alle kommuner
          start: [alle kommuner, alle kommunene, alle landets kommuner, samtlige kommuner,
                  kommunene, kommuner, landets kommuner, alle norske kommuner,
                  kommunane, alle kommunar, alle kommunane, landets kommunar]
        - navn: Alle fylkeskommuner
          start: [alle fylkeskommuner, alle fylkeskommunene, alle landets fylkeskommuner,
                  samtlige fylkeskommuner, fylkeskommunene, fylkeskommuner,
                  landets fylkeskommuner, fylkeskommunane, alle fylkeskommunar,
                  alle fylkeskommunane]
        - navn: KS
          eksakt: [KS, KS Kommunesektorens organisasjon]
          start: ["KS –", "KS -", "KS (", "KS,", Kommunesektorens organisasjon,
                  Kommunenes Sentralforbund]
          utelat: [KS Bedrift, KS Agenda, KS Advokatene, KS-Konsulent, KS Innlandet]
        - navn: Innlandet fylkeskommune
          start: [Innlandet fylkeskommune, Fylkeskommunen i Innlandet]
        - navn: Gjøvikregionen
          inneholder: [Gjøvikregionen, Gjøvikregionen IPR]
        - navn: Regionrådene
          start: [alle regionråd, alle regionrådene, regionrådene, regionråd,
                  interkommunale politiske råd, alle interkommunale politiske råd,
                  de interkommunale politiske rådene]

    # Kategorier som vises på siden. Første regel som treffer, gir kategorien. Parter uten
    # treff telles som «Andre».
    kategorier:
      - navn: Alle kommuner
        start: [alle kommuner, alle kommunene, alle landets kommuner, samtlige kommuner,
                kommunene, kommuner, landets kommuner, alle norske kommuner,
                  kommunane, alle kommunar, alle kommunane, landets kommunar]
      - navn: Alle fylkeskommuner
        start: [alle fylkeskommuner, alle fylkeskommunene, alle landets fylkeskommuner,
                samtlige fylkeskommuner, fylkeskommunene, fylkeskommuner,
                landets fylkeskommuner, fylkeskommunane, alle fylkeskommunar,
                alle fylkeskommunane]
      - navn: Statsforvaltere
        ordslutt: [statsforvalter, statsforvalteren, statsforvalterne, statsforvaltere,
                   fylkesmannen, fylkesmennene]
      - navn: Kommuner og fylkeskommuner
        ordslutt: [kommune, kommunene, kommuner]
        inneholder: [KS, Kommunesektorens organisasjon, regionråd, regionrådene,
                     interkommunale politiske råd, Gjøvikregionen, Gjøvikregionen IPR]
      - navn: Departementer og direktorater
        ordslutt: [departement, departementet, departementene, direktorat, direktoratet,
                   tilsyn, tilsynet, etat, etaten, verket, ombudet, ombodet,
                   ombudsmannen]
        inneholder: [Nav, Statens, Riksantikvaren, Folkehelseinstituttet,
                     Nasjonalt folkehelseinstitutt, Riksrevisjonen, Statsministerens kontor,
                     Politiet, Sametinget, Regjeringsadvokaten, Statistisk sentralbyrå,
                     Forbrukerrådet, Konkurransetilsynet, Norges Bank, Kartverket,
                     Miljødirektoratet, Innovasjon Norge, Norsk akkreditering]
      - navn: Organisasjoner
        ordslutt: [forening, foreningen, forbund, forbundet, organisasjon, organisasjonen,
                   organisasjoner, bondelag, landsforbund, samvirke, sammenslutning]
        inneholder: [NHO, LO, YS, Unio, Akademikerne, Virke, Spekter, Hovedorganisasjonen,
                     Næringslivets Hovedorganisasjon, Fellesorganisasjon, Funksjonshemmedes
                     Fellesorganisasjon, Bonde- og Småbrukarlag, Fornybar Norge, Standard
                     Norge, Abelia, Finans Norge, Huseierne, Natur og Ungdom, ZERO]
    annet: Andre

kategorier:
  - Stortinget
  - Regjeringen og departementene
  - Transport, samferdsel og infrastruktur
  - Miljø, klima, energi og beredskap
  - Oppvekst, utdanning, kultur og integrering
  - Helse, omsorg og velferd
  - Styring, digitalisering, juss og eiendom
  - Regionale ledd

kilder:
  # --- Stortinget og regjeringen (to egne temaer, Svein 25.10.2026) ---
  - navn: Stortinget
    kategori: Stortinget
    niva: Stortinget
    prioritet: 1
    url: https://data.stortinget.no/eksport/horinger
    metode: api
    modul: stortinget
    aktiv: true
    horingsparter: {merknad: Åpen for alle}  # komitéhøringer: alle kan melde seg på
    anbefalt: aktiv
    sprint: 1
    merknad: Spør både nåværende og neste sesjon. Fristen avgjør om høringen er åpen.

  - navn: Regjeringen.no
    kategori: Regjeringen og departementene
    niva: Regjeringen
    # Departementene har ulik prioritet (SPESIFIKASJON.md, avsnitt 2; Svein 25.10.2026).
    prioritet: 2
    prioritet_instans:
      1: [Kommunal- og distriktsdepartementet, Kunnskapsdepartementet,
          Helse- og omsorgsdepartementet, Arbeids- og inkluderingsdepartementet,
          Digitaliserings- og forvaltningsdepartementet, Finansdepartementet]
    url: https://www.regjeringen.no/no/dokument/hoyringar/id1763/
    metode: html
    modul: regjeringen
    kjoring: pc  # Cloudflare stopper GitHub; hentes på GRUs PC (se docs/oppsett-pc.md)
    aktiv: true
    horingsparter: {detalj: true, pdf: true}  # «Høringsinstanser» på detaljsiden, ellers PDF
    anbefalt: aktiv
    sprint: 1
    merknad: Bare ?page= er tillatt i robots.txt. Departementer i ekskluder_departementer filtreres bort.

  # --- Transport, samferdsel og infrastruktur ---
  - navn: Statens vegvesen
    kategori: Transport, samferdsel og infrastruktur
    niva: Direktorater og etater
    prioritet: 1
